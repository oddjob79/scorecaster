server {
    listen 80;
    root /usr/share/nginx/html;

    # Compress text responses, including those proxied from the API.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/competitions -> http://api:8000/competitions (the trailing slash
    # strips /api, matching the Vite dev proxy).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite's hashed files never change content under the same name, so
    # browsers may keep them for a year without asking.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the app. index.html is always revalidated, because
    # it names the current hashed files. Paths with no file (e.g. /team/12)
    # get index.html, and the router picks the page in the browser.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
