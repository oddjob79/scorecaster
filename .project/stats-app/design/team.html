<style>
/* Layout: app bar, selectors, date bar, team header with stat tiles and form, then one chart panel with a metric switch. Tokens from design/style.md. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --fg: #12141c; --muted: #5e6475; --line: #e2e4ea; --grid: #e8eaef;
  --accent: #5a2fd1; --accent-ink: #4a22b8; --on-accent: #ffffff;
  --win: #16a368; --draw: #a3a8b6; --loss: #e5484d;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --r-md: 12px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1016; --surface: #181a23; --fg: #f1f2f6; --muted: #9ba1b3; --line: #2a2d3a; --grid: #252836;
    --accent-ink: #a98cff; --win: #2fc183; --draw: #6f7486; --loss: #ff5c62;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1016; --surface: #181a23; --fg: #f1f2f6; --muted: #9ba1b3; --line: #2a2d3a; --grid: #252836;
  --accent-ink: #a98cff; --win: #2fc183; --draw: #6f7486; --loss: #ff5c62;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select, input { font-family: inherit; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-ink); }
.gutter {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* App bar */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .gutter { display: flex; align-items: center; gap: 24px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.brand span { color: var(--accent-ink); }
.nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.nav a[aria-current="page"] { color: var(--fg); background: var(--bg); }
.nav a:hover { color: var(--fg); }

.pills { display: inline-flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.pills button { font: 700 13px var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.select { font: 700 14px var(--font-body); color: var(--fg); background: var(--surface); border: 0; border-radius: 999px; padding: 9px 16px; min-width: 0; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 999px; border: 2px solid var(--accent); background: transparent;
  color: var(--accent-ink); font: 800 16px var(--font-body); cursor: pointer; display: inline-grid; place-items: center; flex: none;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.btn { font: 800 14px var(--font-body); border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 2px solid transparent; }
.btn-secondary { background: transparent; color: var(--accent-ink); border-color: var(--accent); }
.btn-secondary:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }

main.gutter { display: grid; gap: 20px; padding-block: 24px 56px; }

/* Selectors */
.pickers { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; }
.field .select { min-width: 160px; }

/* Date bar */
.datebar { background: var(--surface); border-radius: var(--r-lg); padding: 16px 20px; display: grid; gap: 10px; }
.datebar-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.as-of { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; }
.as-of small { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }

/* Team header */
.team-head { background: var(--surface); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 20px; }
.team-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.team-top h1 { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.team-body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: center; }
@media (max-width: 820px) { .team-body { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { border-radius: var(--r-md); padding: 14px; display: grid; gap: 2px; background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.tile b { font: 800 36px/1 var(--font-display); letter-spacing: -0.02em; color: var(--accent-ink); }
.tile span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.form-rows { display: grid; grid-template-columns: 72px auto 1fr; gap: 10px 12px; align-items: center; }
.form-rows .pts { font-size: 13px; font-weight: 700; color: var(--muted); }
.form { display: inline-flex; gap: 4px; }
.f { width: 24px; height: 24px; border-radius: 999px; display: inline-grid; place-items: center; font: 800 11px var(--font-body); color: #fff; }
.f.W { background: var(--win); } .f.D { background: var(--draw); } .f.L { background: var(--loss); }

/* Chart panel */
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.panel-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { width: 100%; min-width: 560px; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); font-weight: 600; }
.key { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--accent); margin-right: 6px; vertical-align: 3px; }
.key.dash { border-top-style: dashed; }
.key.thin { border-top-width: 2px; border-top-color: var(--accent-ink); opacity: 0.6; }
.key.box { width: 12px; height: 12px; border: 0; border-radius: 3px; vertical-align: -1px; }
.summary { display: flex; flex-wrap: wrap; gap: 10px; }
.chip-stat { background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.chip-stat b { font-family: var(--font-display); font-weight: 800; }
.note { font-size: 13px; color: var(--muted); }

@media (max-width: 560px) {
  .team-top h1 { font-size: 38px; }
  .as-of { font-size: 20px; }
  .panel, .team-head { padding: 14px; }
  .tile b { font-size: 28px; }
}
</style>

<header class="appbar">
  <div class="gutter">
    <div class="brand">Score<span>caster</span></div>
    <nav class="nav" aria-label="Main">
      <a href="#">Leagues</a>
      <a href="#" aria-current="page">Teams</a>
      <a href="#">Compare</a>
    </nav>

      <button type="button" id="theme-light" aria-pressed="false">Light</button>
      <button type="button" id="theme-dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="pickers">
    <label class="field"><span class="label">Competition</span>
      <select class="select" id="comp-picker"><option>Premier League</option><option>Championship</option><option>La Liga</option></select>
    </label>
    <label class="field"><span class="label">Season</span>
      <select class="select" id="season-picker"><option>2024/25</option><option>2023/24</option><option>2022/23</option></select>
    </label>
    <label class="field"><span class="label">Team</span>
      <select class="select" id="team-picker"></select>
    </label>
  </div>

  <section class="datebar" aria-label="Date">
    <div class="datebar-top">
      <div class="as-of num" id="as-of" aria-live="polite"></div>
      <div class="label" id="played"></div>
    </div>
    <div class="slider-row">
      <button type="button" class="icon-btn" id="prev-day" aria-label="Previous matchday">‹</button>
      <input type="range" id="date-slider" min="0" max="0" step="1" aria-label="Date">
      <button type="button" class="icon-btn" id="next-day" aria-label="Next matchday">›</button>
    </div>
  </section>

  <section class="team-head" aria-label="Team summary">
    <div class="team-top">
      <div>
        <div class="eyebrow" id="team-context"></div>
        <h1 id="team-name"></h1>
      </div>
    </div>
    <div class="team-body">
      <div class="tiles" id="tiles"></div>
      <div class="form-rows" id="form-rows"></div>
    </div>
  </section>

  <section class="panel" aria-label="Chart">
    <div class="panel-head">
      <h2 id="chart-title"></h2>
      <div class="pills" role="group" aria-label="Chart" id="chart-pills">
        <button type="button" data-chart="position" aria-pressed="true">League position</button>
        <button type="button" data-chart="venue" aria-pressed="false">Home / away</button>
        <button type="button" data-chart="form" aria-pressed="false">Form</button>
        <button type="button" data-chart="goals" aria-pressed="false">Goals</button>
        <button type="button" data-chart="elo" aria-pressed="false">Elo journey</button>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap"><svg id="chart" viewBox="0 0 900 340" role="img" aria-label="Team chart"></svg></div>
    <p class="note" id="chart-note"></p>
  </section>
</main>

// The team's matches up to the cutoff, from its own side.
function teamMatches(team, cutoff) {
  const out = [];
  for (const m of MATCHES) {
    if (m.d > cutoff || (m.h !== team && m.a !== team)) continue;
    const home = m.h === team;
    const gf = home ? m.hg : m.ag, ga = home ? m.ag : m.hg;
    out.push({ d: m.d, home, opp: home ? m.a : m.h, gf, ga, res: gf > ga ? "W" : gf === ga ? "D" : "L" });

// Position of every team after each match date, in the overall, home-only and away-only tables.
function positionsByDate(venue) {
  const tally = Object.fromEntries(TEAMS.map(t => [t, { pts: 0, gd: 0, gf: 0 }]));
  const byDate = {};

  for (const d of DATES) {
    for (const m of MATCHES.filter(x => x.d === d)) {
      if (venue !== "away") add(m.h, m.hg, m.ag);
      if (venue !== "home") add(m.a, m.ag, m.hg);
    }
    const order = [...TEAMS].sort((a, b) => (tally[b].pts - tally[a].pts) || (tally[b].gd - tally[a].gd) || (tally[b].gf - tally[a].gf) || a.localeCompare(b));

function chartForm(list) {
  const y = v => PAD.t + (3 - v) / 3 * (H - PAD.t - PAD.b);
  for (const v of [0, 1, 2, 3]) gridY(y(v), v.toFixed(1));
  matchAxis();
  const rolling = (filter, n) => {
    const out = [];
    list.forEach((e, k) => {
      const seen = list.slice(0, k + 1).filter(filter);
      if (!filter(e) || seen.length < Math.min(n, 2)) return;
      const w = seen.slice(-n);
      const ppg = w.reduce((s, x) => s + pts(x.res), 0) / w.length;
      out.push([xMatch(k + 1), y(ppg), e, ppg]);
    });
    return out;
  };
  const xy = s => s.map(p => [p[0], p[1]]);
  const overall = rolling(() => true, 6), home = rolling(e => e.home, 4), away = rolling(e => !e.home, 4);
  line(xy(home), { width: 2, stroke: css("--accent-ink"), opacity: 0.6 });
  line(xy(away), { width: 2, stroke: css("--accent-ink"), opacity: 0.6, dash: "6 5" });
  line(xy(overall));
  overall.forEach((p, k) => dot(p[0], p[1], k === overall.length - 1));
  // Tooltips, e.g. "Last 6: 2.17 pts/game · after Won 1–0 v Liverpool (H)".
  home.forEach(p => hit(p[0], p[1], `Home, last 4: ${p[3].toFixed(2)} pts/game · after ${resultText(p[2])}`));
  away.forEach(p => hit(p[0], p[1], `Away, last 4: ${p[3].toFixed(2)} pts/game · after ${resultText(p[2])}`));
  overall.forEach(p => hit(p[0], p[1], `Last 6: ${p[3].toFixed(2)} pts/game · after ${resultText(p[2])}`));
  setLegend([["", "Overall, last 6"], ["thin", "Home, last 4"], ["thin dash", "Away, last 4"]]);
  const last = (f, n) => { const w = list.filter(f).slice(-n); return w.length ? (w.reduce((s, e) => s + pts(e.res), 0) / w.length).toFixed(2) : "–"; };
  setSummary([["Last 6", last(() => true, 6) + " pts/game"], ["Home 4", last(e => e.home, 4) + " pts/game"], ["Away 4", last(e => !e.home, 4) + " pts/game"]]);
  return "Form: points per game, rolling";
}

function chartGoals(list) {
  const top = Math.max(5, ...list.map(e => Math.max(e.gf, e.ga)));
  const mid = PAD.t + (H - PAD.t - PAD.b) / 2;
  const half = (H - PAD.t - PAD.b) / 2;
  const y = v => mid - v / top * half;
  for (let v = -top; v <= top; v++) if (v % 2 === 0 || top <= 5) gridY(y(v), Math.abs(v));
  matchAxis();
  const bw = (W - PAD.l - PAD.r) / SLOTS * 0.6;
  list.forEach((e, k) => {
    const x = xMatch(k + 1) - bw / 2;
    if (e.gf) add("rect", { x, y: y(e.gf), width: bw, height: mid - y(e.gf), rx: 3, fill: css("--accent") });
    if (e.ga) add("rect", { x, y: mid, width: bw, height: y(-e.ga) - mid, rx: 3, fill: css("--muted"), opacity: 0.55 });
  });
  add("line", { x1: PAD.l, x2: W - PAD.r, y1: mid, y2: mid, stroke: css("--muted"), "stroke-width": 1.5 });
  const roll = key => list.map((e, k) => { const w = list.slice(Math.max(0, k - 5), k + 1); return [xMatch(k + 1), y((key === "gf" ? 1 : -1) * w.reduce((s, x) => s + x[key], 0) / w.length)]; });
  line(roll("gf"), { width: 2.5, stroke: css("--accent-ink") });
  line(roll("ga"), { width: 2.5, stroke: css("--fg"), dash: "6 5", opacity: 0.7 });
  axisText(PAD.l + 6, PAD.t + 10, "Scored", "start", 700);
  axisText(PAD.l + 6, H - PAD.b - 4, "Conceded", "start", 700);
  setLegend([["box", "Goals scored", "background:var(--accent)"], ["box", "Goals conceded", "background:var(--muted);opacity:.55"], ["thin", "6-match average"]]);
  const gf = list.reduce((s, e) => s + e.gf, 0), ga = list.reduce((s, e) => s + e.ga, 0);
  setSummary([["Scored", gf], ["Conceded", ga], ["Per game", list.length ? `${(gf / list.length).toFixed(1)} – ${(ga / list.length).toFixed(1)}` : "–"], ["Clean sheets", list.filter(e => e.ga === 0).length]]);
  return "Goals for and against, per match";
}

const DAY0 = Date.parse("2016-01-01T00:00:00Z");
const toDays = d => Math.round((Date.parse(d + "T00:00:00Z") - DAY0) / 86400000);
function chartElo() {
  const data = ELO.teams[state.team] || [];
  if (!data.length) return "Elo journey";
  const d0 = toDays("2016-08-01"), d1 = Math.max(data.at(-1)[0], toDays("2027-01-01"));
  const x = d => PAD.l + (d - d0) / (d1 - d0) * (W - PAD.l - PAD.r);
  let lo = Math.min(...data.map(r => r[1])), hi = Math.max(...data.map(r => r[1]));
  lo = Math.floor((lo - 20) / 50) * 50; hi = Math.ceil((hi + 20) / 50) * 50;
  const y = v => PAD.t + 16 + (hi - v) / (hi - lo) * (H - PAD.t - 16 - PAD.b);
  // Division bands: contiguous runs of the same competition.
  const runs = [];
  data.forEach(r => { const c = ELO.codes[r[2]]; if (!runs.length || runs.at(-1).c !== c) runs.push({ c, a: r[0], b: r[0] }); else runs.at(-1).b = r[0]; });
  runs.forEach((run, k) => {
    const a = k === 0 ? d0 : (runs[k - 1].b + run.a) / 2, b = k === runs.length - 1 ? d1 : (run.b + runs[k + 1].a) / 2;
    const op = run.c === "E0" ? 0.12 : run.c === "E1" ? 0.05 : 0;
    add("rect", { x: x(a), y: PAD.t, width: x(b) - x(a), height: H - PAD.t - PAD.b, fill: css("--accent"), "fill-opacity": op });
    if (x(b) - x(a) > 70) add("text", { x: x(a) + 6, y: PAD.t + 12, "font-size": 11, "font-weight": 800, fill: css("--accent-ink"), "font-family": font }, DIVISION[run.c].toUpperCase());
  });
  for (let v = lo; v <= hi; v += 50) if ((v - lo) % 100 === 0) gridY(y(v), v);
  for (let yr = 2016; yr <= 2026; yr++) {
    const d = toDays(`${yr}-08-01`);
    add("line", { x1: x(d), x2: x(d), y1: H - PAD.b, y2: H - PAD.b + 5, stroke: css("--muted") });
    axisText(x(d) + 4, H - 14, `${String(yr).slice(2)}/${String(yr + 1).slice(2)}`, "start");
  }
  // Marker at the slider date.
  const md = toDays(DATES[state.i]);
  add("line", { x1: x(md), x2: x(md), y1: PAD.t, y2: H - PAD.b, stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": "3 4", opacity: 0.6 });
  line(data.map(r => [x(r[0]), y(r[1])]), { width: 2.5 });
  const near = data.reduce((best, r) => (r[0] <= md ? r : best), data[0]);
  dot(x(near[0]), y(near[1]), true);
  endLabel(x(near[0]), y(near[1]), near[1]);
  setLegend([["", "Elo before each match"], ["box", "Premier League season", "background:color-mix(in srgb,var(--accent) 24%,var(--surface))"], ["box", "Championship season", "background:color-mix(in srgb,var(--accent) 10%,var(--surface))"]]);
  setSummary([["On " + new Date(DATES[state.i] + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), near[1]], ["Peak since 2016", Math.max(...data.map(r => r[1]))], ["Low since 2016", Math.min(...data.map(r => r[1]))]]);
  return "Elo journey since 2016/17";
}

const NOTES = {
  position: "Position in the table after each of the team's matches, counting every match played that day.",
  venue: "Position in a table of home matches only, and in a table of away matches only, after each of the team's matches. Both tables include every team's matches up to that day.",
  form: "Rolling points per game: the last 6 matches overall, and the last 4 at home or away.",
  goals: "Bars above the line are goals scored, below are goals conceded. Lines are 6-match rolling averages.",
  elo: "Covers every season since 2016/17, not just the selected one; the dashed line marks the selected date. Elo uses a separate 1500-centred scale per division, so a promotion shows as a drop and a relegation as a rise.",
};

function renderChart() {
  svg = document.getElementById("chart");
  svg.innerHTML = "";
  const list = teamMatches(state.team, DATES[state.i]);
  const title = { position: chartPosition, venue: chartVenue, form: chartForm, goals: chartGoals, elo: chartElo }[state.chart](list);
  document.getElementById("chart-title").textContent = title;
  document.getElementById("chart-note").textContent = NOTES[state.chart];
  svg.setAttribute("aria-label", `${state.team}: ${title}`);
}

function renderDate() {
  const d = DATES[state.i];
  document.getElementById("as-of").innerHTML = `${niceDate(d)}<small>as of 23:59</small>`;
  document.getElementById("played").textContent = `${teamMatches(state.team, d).length} of 38 matches played`;
  const slider = document.getElementById("date-slider");
  slider.value = state.i;
  slider.setAttribute("aria-valuetext", niceDate(d));
  document.getElementById("prev-day").disabled = state.i === 0;
  document.getElementById("next-day").disabled = state.i === DATES.length - 1;
}

function render() { renderDate(); renderHeader(); renderChart(); }

(function () {
  const picker = document.getElementById("team-picker");
  picker.innerHTML = TEAMS.map(t => `<option${t === state.team ? " selected" : ""}>${t}</option>`).join("");
  picker.addEventListener("change", () => { state.team = picker.value; render(); });
  const slider = document.getElementById("date-slider");
  slider.max = DATES.length - 1;
  slider.addEventListener("input", () => { state.i = +slider.value; render(); });
  document.getElementById("prev-day").addEventListener("click", () => { state.i = Math.max(0, state.i - 1); render(); });
  document.getElementById("next-day").addEventListener("click", () => { state.i = Math.min(DATES.length - 1, state.i + 1); render(); });
  document.querySelectorAll("#chart-pills [data-chart]").forEach(b => b.addEventListener("click", () => {
    state.chart = b.dataset.chart;
    document.querySelectorAll("#chart-pills [data-chart]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderChart();
  }));
  const darkBtn = document.getElementById("theme-dark"), lightBtn = document.getElementById("theme-light");
  const current = () => root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const sync = () => { const t = current(); darkBtn.setAttribute("aria-pressed", String(t === "dark")); lightBtn.setAttribute("aria-pressed", String(t === "light")); renderChart(); };
  darkBtn.addEventListener("click", () => { root.setAttribute("data-theme", "dark"); sync(); });
  lightBtn.addEventListener("click", () => { root.setAttribute("data-theme", "light"); sync(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sync);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderChart);
  sync();
  render();
})();
</script>
