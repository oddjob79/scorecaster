<style>
/* Layout: app bar, league header, date bar, then table (main) beside top-performer cards (aside). Tokens from design/style.md. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --fg: #12141c; --muted: #5e6475; --line: #e2e4ea; --grid: #e8eaef;
  --accent: #5a2fd1; --accent-ink: #4a22b8; --on-accent: #ffffff;
  --win: #16a368; --draw: #a3a8b6; --loss: #e5484d;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --r-md: 12px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1016; --surface: #181a23; --fg: #f1f2f6; --muted: #9ba1b3; --line: #2a2d3a; --grid: #252836;
    --accent-ink: #a98cff; --win: #2fc183; --draw: #6f7486; --loss: #ff5c62;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1016; --surface: #181a23; --fg: #f1f2f6; --muted: #9ba1b3; --line: #2a2d3a; --grid: #252836;
  --accent-ink: #a98cff; --win: #2fc183; --draw: #6f7486; --loss: #ff5c62;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select, input { font-family: inherit; }
.num { font-variant-numeric: tabular-nums; }
.soft { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-ink); }
.gutter {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* App bar */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .gutter { display: flex; align-items: center; gap: 24px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.brand span { color: var(--accent-ink); }
.nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.nav a[aria-current="page"] { color: var(--fg); background: var(--bg); }
.nav a:hover { color: var(--fg); }

/* Pills and selects */
.pills { display: inline-flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.panel .pills { background: var(--bg); }
.appbar .pills { background: var(--bg); }
.pills button { font: 700 13px var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.select { font: 700 14px var(--font-body); color: var(--fg); background: var(--surface); border: 0; border-radius: 999px; padding: 9px 16px; min-width: 0; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 999px; border: 2px solid var(--accent); background: transparent;
  color: var(--accent-ink); font: 800 16px var(--font-body); cursor: pointer; display: inline-grid; place-items: center; flex: none;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }

main.gutter { display: grid; gap: 20px; padding-block: 24px 56px; }

/* League header */
.league-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.league-head h1 { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.league-head .pickers { display: flex; gap: 8px; flex-wrap: wrap; }

/* Date bar */
.datebar { background: var(--surface); border-radius: var(--r-lg); padding: 16px 20px; display: grid; gap: 10px; }
.datebar-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.as-of { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; }
.as-of small { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding-inline: 48px; }

/* Main grid */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.panel-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 8px; white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
th[aria-sort] { color: var(--accent-ink); }
td { text-align: right; padding: 9px 8px; white-space: nowrap; background: var(--bg); }
td:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
td:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; }
th.l, td.l { text-align: left; }
td.pos { font-family: var(--font-display); font-weight: 800; font-size: 17px; width: 36px; }
td.team { font-weight: 800; }
td.key { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
tr.lead td { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
tr.lead td.pos { color: var(--accent-ink); }
.note { font-size: 13px; color: var(--muted); }

/* Form chips */
.form { display: inline-flex; gap: 4px; }
.f { width: 22px; height: 22px; border-radius: 999px; display: inline-grid; place-items: center; font: 800 11px var(--font-body); color: #fff; }
.f.W { background: var(--win); } .f.D { background: var(--draw); } .f.L { background: var(--loss); }

/* Top performers */
.aside { display: grid; gap: 12px; }
.aside-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.aside-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
.aside-nav { display: flex; gap: 6px; align-items: center; }
.cards { display: grid; gap: 12px; }
@media (max-width: 1000px) { .cards { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
.pcard { border-radius: var(--r-lg); padding: 16px; display: grid; gap: 6px; background: var(--surface); }
.pcard .metric { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pcard .who { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
.pcard .value { display: flex; align-items: baseline; gap: 8px; }
.pcard .value b { font: 800 36px/1 var(--font-display); color: var(--accent-ink); letter-spacing: -0.02em; }
.pcard .value span { font-size: 13px; color: var(--muted); font-weight: 600; }
.pcard.lead-card { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots span { width: 8px; height: 8px; border-radius: 999px; background: var(--line); }
.dots span.on { background: var(--accent); }
.pause { font: 700 12px var(--font-body); color: var(--muted); background: transparent; border: 0; cursor: pointer; padding: 4px 6px; }

@media (max-width: 560px) {
  .league-head h1 { font-size: 38px; }
  .as-of { font-size: 20px; }
  .ticks { padding-inline: 0; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

      </div>
      <div class="controls">

          <button type="button" data-view="discipline" aria-pressed="false">Discipline</button>
        </div>
      </div>
      <div class="table-wrap"><table id="stats-table"></table></div>
      <p class="note" id="table-note"></p>
    </section>

    <aside class="aside" aria-label="Top performers">
      <div class="aside-head">
        <h2>Top performers</h2>
        <div class="aside-nav">
          <button type="button" class="pause" id="pause">Pause</button>
          <button type="button" class="icon-btn" id="prev-cards" aria-label="Previous cards">‹</button>
          <button type="button" class="icon-btn" id="next-cards" aria-label="Next cards">›</button>
        </div>
      </div>
      <div class="cards" id="cards" aria-live="polite"></div>
      <div class="dots" id="dots"></div>
    </aside>
  </div>
</main>

const root = document.documentElement;
const DATES = [...new Set(MATCHES.map(m => m.d))].sort();
const TEAMS = [...new Set(MATCHES.flatMap(m => [m.h, m.a]))].sort();
const state = { i: DATES.indexOf("2025-02-01"), view: "table", venue: "overall", sort: null, page: 0, paused: false };

// One entry per team per match, from that team's side.
function entries(cutoff) {
  const out = [];
  for (const m of MATCHES) {
    if (m.d > cutoff) continue;
    const side = (team, isHome) => {
      const gf = isHome ? m.hg : m.ag, ga = isHome ? m.ag : m.hg;
      return {
        team, d: m.d, home: isHome, opp: isHome ? m.a : m.h, gf, ga, res: gf > ga ? "W" : gf === ga ? "D" : "L",
        shots: isHome ? m.hs : m.as_, sot: isHome ? m.hst : m.ast, shotsAg: isHome ? m.as_ : m.hs,
        corners: isHome ? m.hc : m.ac, fouls: isHome ? m.hf : m.af, y: isHome ? m.hy : m.ay, r: isHome ? m.hr : m.ar,
      };
    };
    out.push(side(m.h, true), side(m.a, false));
  }
  return out;
}

function byTeam(list) {
  const map = new Map(TEAMS.map(t => [t, []]));
  for (const e of list) map.get(e.team).push(e);
  return map;
}

const pts = r => (r === "W" ? 3 : r === "D" ? 1 : 0);
const per = (a, b) => (b ? a / b : 0);
const one = v => v.toFixed(1);
const pct = v => Math.round(v * 100) + "%";
const sign = v => (v > 0 ? "+" + v : String(v));

function summarise(team, list) {
  const n = list.length, sum = k => list.reduce((s, e) => s + (e[k] || 0), 0);
  const w = list.filter(e => e.res === "W").length, d = list.filter(e => e.res === "D").length;
  const gf = sum("gf"), ga = sum("ga");
  return {
    team, p: n, w, d, l: n - w - d, gf, ga, gd: gf - ga, pts: w * 3 + d,
    form: list.map(e => e.res).join(""),
    gfpg: per(gf, n), gapg: per(ga, n),
    cs: list.filter(e => e.ga === 0).length, fts: list.filter(e => e.gf === 0).length,
    btts: per(list.filter(e => e.gf > 0 && e.ga > 0).length, n), o25: per(list.filter(e => e.gf + e.ga > 2).length, n),
    shotspg: per(sum("shots"), n), sotpg: per(sum("sot"), n), acc: per(sum("sot"), sum("shots")),
    cornerspg: per(sum("corners"), n), shotsagpg: per(sum("shotsAg"), n),
    foulspg: per(sum("fouls"), n), y: sum("y"), r: sum("r"), cardspg: per(sum("y") + sum("r"), n),
  };
}

// Column sets per view. `key` marks the default sort column.
const VIEWS = {
  table: {
    title: "League table",
    cols: [["p", "P"], ["w", "W"], ["d", "D"], ["l", "L"], ["gf", "F"], ["ga", "A"], ["gd", "GD", sign], ["pts", "Pts", null, true]],
    sort: { k: "pts", dir: -1 }, chips: true,
  },
  form: {
    title: "Form table",
    cols: [["p", "P"], ["w", "W"], ["d", "D"], ["l", "L"], ["gf", "F"], ["ga", "A"], ["gd", "GD", sign], ["pts", "Pts", null, true]],
    sort: { k: "pts", dir: -1 }, chips: true, windowed: true,
  },
  goals: {
    title: "Goals",
    cols: [["p", "P"], ["gfpg", "For/g", one, true], ["gapg", "Agst/g", one], ["cs", "Clean sh."], ["fts", "Failed to sc."], ["btts", "BTTS", pct], ["o25", "Over 2.5", pct]],
    sort: { k: "gfpg", dir: -1 },
  },
  shots: {
    title: "Shots",
    cols: [["p", "P"], ["shotspg", "Shots/g", one, true], ["sotpg", "On target/g", one], ["acc", "Accuracy", pct], ["shotsagpg", "Faced/g", one], ["cornerspg", "Corners/g", one]],
    sort: { k: "shotspg", dir: -1 },
  },
  discipline: {
    title: "Discipline",
    cols: [["p", "P"], ["foulspg", "Fouls/g", one], ["y", "Yellows"], ["r", "Reds"], ["cardspg", "Cards/g", one, true]],
    sort: { k: "cardspg", dir: 1 },
  },
};

function windowSize() { return state.venue === "overall" ? 6 : 4; }

function rows() {
  const cutoff = DATES[state.i];
  const map = byTeam(entries(cutoff));
  const v = VIEWS[state.view];
  const out = [];
  for (const [team, list] of map) {
    let l = list.filter(e => state.venue === "overall" || (state.venue === "home") === e.home);
    const chipList = l.slice(-windowSize());
    if (v.windowed) l = chipList;
    const s = summarise(team, l);
    s.chips = chipList;
    out.push(s);
  }
  const sort = state.sort || v.sort;
  out.sort((a, b) => {
    const d = (a[sort.k] - b[sort.k]) * sort.dir;
    if (d) return d;
    return (b.pts - a.pts) || (b.gd - a.gd) || (b.gf - a.gf) || a.team.localeCompare(b.team);
  });
  return out;
}

// Form chips; hovering one shows the result, e.g. "Won 2–1 v Arsenal (H) · Sat 25 Jan".
function chipsEl(list) {
  const span = document.createElement("span");
  span.className = "form";
  for (const e of list) {
    const c = document.createElement("span");
    c.className = "f " + e.res;
    c.textContent = e.res;
    const word = e.res === "W" ? "Won" : e.res === "D" ? "Drew" : "Lost";
    const when = new Date(e.d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    const text = `${word} ${e.gf}–${e.ga} v ${e.opp} (${e.home ? "H" : "A"}) · ${when}`;
    c.title = text;
    c.setAttribute("aria-label", text);
    c.tabIndex = 0;
    span.appendChild(c);
  }
  return span;
}

function renderTable() {
  const v = VIEWS[state.view];
  const sort = state.sort || v.sort;
  const table = document.getElementById("stats-table");
  const venueWord = { overall: "", home: " · Home", away: " · Away" }[state.venue];
  document.getElementById("view-title").textContent = v.title + venueWord;
  let head = '<thead><tr><th class="l">#</th><th class="l">Team</th>';
  for (const [k, label] of v.cols) {
    const s = sort.k === k ? ` aria-sort="${sort.dir < 0 ? "descending" : "ascending"}"` : "";
    head += `<th${s}><button type="button" data-sort="${k}">${label}</button></th>`;
  }
  if (v.chips) head += `<th class="l">Last ${windowSize()}</th>`;
  head += "</tr></thead>";
  table.innerHTML = head + "<tbody></tbody>";
  const body = table.querySelector("tbody");
  rows().forEach((r, i) => {
    const tr = document.createElement("tr");
    if (i === 0) tr.className = "lead";
    let html = `<td class="l pos">${i + 1}</td><td class="l team">${r.team}</td>`;
    for (const [k, , fmt, key] of v.cols) html += `<td class="${key ? "key" : ""}">${fmt ? fmt(r[k]) : r[k]}</td>`;
    tr.innerHTML = html;
    if (v.chips) { const td = document.createElement("td"); td.className = "l"; td.appendChild(chipsEl(r.chips)); tr.appendChild(td); }
    body.appendChild(tr);
  });
  table.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.sort;
    const cur = state.sort || v.sort;
    state.sort = { k, dir: cur.k === k ? -cur.dir : -1 };
    renderTable();
  }));
  const notes = {
    table: "All matches up to the date. Ties broken by goal difference, then goals scored.",
    form: `Each team's last ${windowSize()} ${state.venue === "overall" ? "" : state.venue + " "}matches only.`,
    goals: "Per game, season to date. BTTS: both teams scored.",
    shots: "Per game, season to date. Accuracy: shots on target ÷ shots.",
    discipline: "Season to date. Sorted fewest cards per game first.",
  };
  document.getElementById("table-note").textContent = notes[state.view] + " Click a column heading to sort.";
}

// Top performers, overall, at the chosen date.
function performers() {
  const map = byTeam(entries(DATES[state.i]));
  const all = [...map].map(([team, l]) => ({ team, l }));
  const best = (score, higher = true, min = 1) => {
    const ok = all.filter(t => t.l.length >= min).map(t => ({ team: t.team, v: score(t.l), l: t.l }));
    const top = higher ? Math.max(...ok.map(t => t.v)) : Math.min(...ok.map(t => t.v));
    return { teams: ok.filter(t => t.v === top), v: top };
  };
  const last = n => l => l.slice(-n);
  const unbeaten = l => { let n = 0; for (let i = l.length - 1; i >= 0 && l[i].res !== "L"; i--) n++; return n; };
  const ppgAt = home => l => { const x = l.filter(e => e.home === home); return x.length ? x.reduce((s, e) => s + pts(e.res), 0) / x.length : 0; };
  return [
    { metric: "Best form, last 6", r: best(l => last(6)(l).reduce((s, e) => s + pts(e.res), 0)), unit: "pts", chips: true },
    { metric: "Most goals, last 6", r: best(l => last(6)(l).reduce((s, e) => s + e.gf, 0)), unit: "goals" },
    { metric: "Tightest defence, last 6", r: best(l => last(6)(l).reduce((s, e) => s + e.ga, 0), false), unit: "conceded" },
    { metric: "Worst form, last 6", r: best(l => last(6)(l).reduce((s, e) => s + pts(e.res), 0), false), unit: "pts", chips: true },
    { metric: "Longest unbeaten run", r: best(unbeaten), unit: "matches" },
    { metric: "Most clean sheets", r: best(l => l.filter(e => e.ga === 0).length), unit: "this season" },
    { metric: "Best home record", r: best(ppgAt(true), true, 3), unit: "pts per game", fmt: v => v.toFixed(2) },
    { metric: "Best away record", r: best(ppgAt(false), true, 3), unit: "pts per game", fmt: v => v.toFixed(2) },
  ];
}

const PER_PAGE = 4;
function renderCards() {
  const list = performers();
  const pages = Math.ceil(list.length / PER_PAGE);
  state.page = (state.page + pages) % pages;
  const box = document.getElementById("cards");
  box.innerHTML = "";
  list.slice(state.page * PER_PAGE, state.page * PER_PAGE + PER_PAGE).forEach((c, idx) => {
    const el = document.createElement("article");
    el.className = "pcard" + (idx === 0 ? " lead-card" : "");
    const names = c.r.teams.map(t => t.team);
    const who = names.length > 2 ? `${names[0]} and ${names.length - 1} others` : names.join(" & ");
    el.innerHTML = `<div class="metric">${c.metric}</div><div class="who">${who}</div><div class="value"><b class="num">${c.fmt ? c.fmt(c.r.v) : c.r.v}</b><span>${c.unit}</span></div>`;
    if (c.chips && c.r.teams.length === 1) el.appendChild(chipsEl(c.r.teams[0].l.slice(-6)));
    box.appendChild(el);
  });
  document.getElementById("dots").innerHTML = Array.from({ length: pages }, (_, i) => `<span class="${i === state.page ? "on" : ""}"></span>`).join("");
}

function renderDate() {
  const d = DATES[state.i];
  const nice = new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  document.getElementById("as-of").innerHTML = `${nice}<small>as of 23:59</small>`;
  const played = MATCHES.filter(m => m.d <= d).length;
  document.getElementById("played").textContent = `${played} of ${MATCHES.length} matches played`;
  const slider = document.getElementById("date-slider");
  slider.value = state.i;
  slider.setAttribute("aria-valuetext", nice);
  document.getElementById("prev-day").disabled = state.i === 0;
  document.getElementById("next-day").disabled = state.i === DATES.length - 1;
}

function render() { renderDate(); renderTable(); renderCards(); }

// Wiring.
(function () {
  const slider = document.getElementById("date-slider");
  slider.max = DATES.length - 1;
  slider.addEventListener("input", () => { state.i = +slider.value; render(); });
  document.getElementById("prev-day").addEventListener("click", () => { state.i = Math.max(0, state.i - 1); render(); });
  document.getElementById("next-day").addEventListener("click", () => { state.i = Math.min(DATES.length - 1, state.i + 1); render(); });
  const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { month: "short" });
  const months = [];
  for (const d of DATES) { const m = fmt(d); if (months[months.length - 1] !== m) months.push(m); }
  document.getElementById("ticks").innerHTML = months.map(m => `<span>${m}</span>`).join("");

  document.querySelectorAll("#view-pills [data-view]").forEach(b => b.addEventListener("click", () => {
    state.view = b.dataset.view; state.sort = null;
    document.querySelectorAll("#view-pills [data-view]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderTable();
  }));
  document.querySelectorAll("#venue-pills [data-venue]").forEach(b => b.addEventListener("click", () => {
    state.venue = b.dataset.venue;
    document.querySelectorAll("#venue-pills [data-venue]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderTable();
  }));

  document.getElementById("prev-cards").addEventListener("click", () => { state.page--; renderCards(); });
  document.getElementById("next-cards").addEventListener("click", () => { state.page++; renderCards(); });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pauseBtn = document.getElementById("pause");
  state.paused = reduce;
  pauseBtn.textContent = state.paused ? "Play" : "Pause";
  pauseBtn.addEventListener("click", () => { state.paused = !state.paused; pauseBtn.textContent = state.paused ? "Play" : "Pause"; });
  setInterval(() => { if (!state.paused && !document.hidden) { state.page++; renderCards(); } }, 8000);

  const darkBtn = document.getElementById("theme-dark"), lightBtn = document.getElementById("theme-light");
  const current = () => root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const sync = () => { const t = current(); darkBtn.setAttribute("aria-pressed", String(t === "dark")); lightBtn.setAttribute("aria-pressed", String(t === "light")); };
  darkBtn.addEventListener("click", () => { root.setAttribute("data-theme", "dark"); sync(); });
  lightBtn.addEventListener("click", () => { root.setAttribute("data-theme", "light"); sync(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sync);
  sync();
  render();
})();
</script>
