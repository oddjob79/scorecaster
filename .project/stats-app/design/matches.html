<style>
/* Layout: app bar, day strip with a month picker, then competitions filter (aside) beside matches grouped by competition (main). Tokens from design/style.md. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --fg: #12141c; --muted: #5e6475; --line: #e2e4ea; --grid: #e8eaef;
  --accent: #5a2fd1; --accent-ink: #4a22b8; --on-accent: #ffffff;
  --series-2: #d9731a;
  --win: #16a368; --draw: #a3a8b6; --loss: #e5484d;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --r-md: 12px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1016; --surface: #181a23; --fg: #f1f2f6; --muted: #9ba1b3; --line: #2a2d3a; --grid: #252836;
    --accent-ink: #a98cff; --series-2: #ff9a45; --win: #2fc183; --draw: #6f7486; --loss: #ff5c62;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1016; --surface: #181a23; --fg: #f1f2f6; --muted: #9ba1b3; --line: #2a2d3a; --grid: #252836;
  --accent-ink: #a98cff; --series-2: #ff9a45; --win: #2fc183; --draw: #6f7486; --loss: #ff5c62;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input { font-family: inherit; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-ink); }
.gutter {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* App bar */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .gutter { display: flex; align-items: center; gap: 24px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.brand span { color: var(--accent-ink); }
.nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.nav a[aria-current="page"] { color: var(--fg); background: var(--bg); }
.pills { display: inline-flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.pills button { font: 700 13px var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 999px; border: 2px solid var(--accent); background: transparent;
  color: var(--accent-ink); font: 800 16px var(--font-body); cursor: pointer; display: inline-grid; place-items: center; flex: none;
}
.btn { font: 800 14px var(--font-body); border-radius: 999px; padding: 8px 16px; cursor: pointer; border: 2px solid var(--accent); background: transparent; color: var(--accent-ink); }
.btn[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); }
.btn-text { font: 700 13px var(--font-body); background: none; border: 0; color: var(--accent-ink); cursor: pointer; padding: 2px 4px; }

main.gutter { display: grid; gap: 20px; padding-block: 24px 56px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.head h1 { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.mock-note { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 6px 12px; }

/* Day strip */
.strip { background: var(--surface); border-radius: var(--r-lg); padding: 12px; display: flex; gap: 10px; align-items: center; position: relative; }
.days { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.day {
  flex: 1 0 84px; border: 0; background: var(--bg); color: var(--fg); border-radius: var(--r-md); padding: 8px 6px; cursor: pointer;
  display: grid; gap: 0; text-align: center; font: 700 13px var(--font-body);
}
.day .dn { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.day .dd { font: 800 20px/1.2 var(--font-display); }
.day .dc { font-size: 11px; color: var(--muted); }
.day.today .dn { color: var(--accent-ink); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .dc { color: color-mix(in srgb, var(--on-accent) 80%, transparent); }
.day.empty { opacity: 0.45; }

/* Month popover */
.month { position: absolute; right: 12px; top: calc(100% + 8px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; width: 320px; max-width: calc(100vw - 32px); box-shadow: 0 12px 32px rgba(0,0,0,0.18); display: grid; gap: 10px; }
.month-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-head b { font: 800 18px var(--font-display); }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.grid7 .wd { font-size: 11px; font-weight: 700; color: var(--muted); }
.grid7 button { border: 0; background: transparent; color: var(--fg); border-radius: 10px; padding: 6px 0 8px; font: 700 13px var(--font-body); cursor: pointer; position: relative; }
.grid7 button:disabled { color: var(--muted); opacity: 0.4; cursor: default; }
.grid7 button.has::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 999px; background: var(--accent); }
.grid7 button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.grid7 button[aria-pressed="true"]::after { background: var(--on-accent); }

/* Layout */
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; min-width: 0; }

/* Filter */
.filter h2 { font-size: 20px; font-weight: 800; }
.filter-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.country { display: grid; gap: 2px; }
.country + .country { border-top: 1px solid var(--line); padding-top: 6px; }
.check.country-check { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.country .check:not(.country-check) { padding-left: 22px; }
.check { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.check:hover { background: var(--bg); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.check .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 700; }
.filter-toggle { display: none; }
@media (max-width: 900px) {
  .filter-toggle { display: inline-flex; }
  .filter[data-open="false"] .filter-body { display: none; }
}

/* Matches */
.matches { display: grid; gap: 16px; min-width: 0; }
.comp { background: var(--surface); border-radius: var(--r-lg); padding: 8px 8px 10px; display: grid; gap: 4px; }
.comp-head { display: flex; align-items: baseline; gap: 10px; padding: 8px 10px 6px; }
.comp-head h2 { font-size: 20px; font-weight: 800; }
/* The match row, the team boxes and the odds row share one column grid, so home sits under home and away under away. */
.match { --cols: 52px minmax(0, 1fr) 140px minmax(0, 1fr) 24px; border-radius: var(--r-md); background: var(--bg); }
.row {
  width: 100%; border: 0; background: transparent; color: var(--fg); cursor: pointer; border-radius: var(--r-md);
  display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: center;
  padding: 10px 10px; font: 700 15px var(--font-body); text-align: left;
}
.row:hover { background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }
.row .ko { font-size: 12px; color: var(--muted); font-weight: 700; }
.row .home { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .away { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .won { font-weight: 800; }
.row .lost { color: var(--muted); }
.score { justify-self: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 72px; padding: 4px 10px; border-radius: 999px; background: var(--surface); font: 800 17px var(--font-display); }
.score.upcoming { font: 800 13px var(--font-body); color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.chev { color: var(--muted); font-weight: 800; transition: transform 0.15s; text-align: center; }
.row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.empty-state { padding: 24px; text-align: center; color: var(--muted); font-weight: 600; }

/* Detail */
.detail { padding: 0 10px 14px; display: grid; gap: 12px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.detail-grid > * { min-width: 0; }
.box { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 8px; }
.box h3 { font-size: 15px; font-weight: 800; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.kv span:first-child { color: var(--muted); font-weight: 600; }
.kv b { font-weight: 800; }
.stat { display: grid; grid-template-columns: 28px 1fr auto 1fr 28px; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.stat .nm { color: var(--muted); font-weight: 700; text-align: center; min-width: 78px; }
.stat .v { text-align: center; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; display: flex; }
.bar.l { justify-content: flex-end; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.bar.l i { background: var(--accent); }
.bar.r i { background: var(--series-2); }
/* Result odds: a table of pre-match and closing prices. */
.odds { width: 100%; border-collapse: separate; border-spacing: 0 3px; font-variant-numeric: tabular-nums; font-size: 13px; }
.odds th { text-align: right; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; }
.odds th:first-child, .odds td:first-child { text-align: left; }
.odds td { text-align: right; padding: 5px 6px; background: var(--bg); font-weight: 700; }
.odds td:first-child { border-radius: 8px 0 0 8px; color: var(--muted); }
.odds td:last-child { border-radius: 0 8px 8px 0; }
.odds td.hit { background: color-mix(in srgb, var(--win) 18%, var(--surface)); }
.odds small { color: var(--muted); font-weight: 600; }
/* Fixture odds: three equal columns, home left, draw centre, away right. */
.odds-block { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 10px; }
.odds-block h3 { font-size: 15px; font-weight: 800; }
.odds3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.oitem { background: var(--bg); border-radius: 10px; padding: 8px 12px; display: grid; gap: 1px; min-width: 0; }
.oitem .ol { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.oitem .ov { font: 800 17px var(--font-display); font-variant-numeric: tabular-nums; }
.oitem small { font: 600 12px var(--font-body); color: var(--muted); }

/* Versus */
.vs { display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: stretch; }
.side { background: var(--surface); border-radius: var(--r-md); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side.home { grid-column: 1 / 3; }
.side.away { grid-column: 4 / 6; }
.side h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.side.home h3 { color: var(--accent-ink); }
.side.away h3 { color: var(--series-2); }
.vs-mid { grid-column: 3; display: grid; place-items: center; font: 800 28px var(--font-display); color: var(--muted); }
.mini-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.mini-tiles div { background: var(--bg); border-radius: 10px; padding: 8px; display: grid; min-width: 0; }
.mini-tiles b { font: 800 22px/1.1 var(--font-display); }
.mini-tiles span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.form-rows { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.form-rows > span { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.form { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.f { width: 22px; height: 22px; border-radius: 999px; display: inline-grid; place-items: center; font: 800 11px var(--font-body); color: #fff; }
.f.W { background: var(--win); } .f.D { background: var(--draw); } .f.L { background: var(--loss); }
/* Narrow screens: the match row keeps its columns; the team boxes and odds stack. */
@media (max-width: 700px) {
  .match { --cols: 36px minmax(0, 1fr) 76px minmax(0, 1fr) 14px; }
  .row { gap: 6px; font-size: 14px; padding-inline: 8px; }
  .score { min-width: 60px; padding-inline: 6px; }
  .vs { grid-template-columns: 1fr; }
  .side.home, .side.away, .vs-mid { grid-column: auto; }
  .vs-mid { font-size: 20px; }
  .oitem { padding: 6px 8px; }
  .oitem .ov { font-size: 15px; }
  .head h1 { font-size: 38px; }
}

/* Overlay chart */
.chart-box { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 10px; }
.chart-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { width: 100%; min-width: 520px; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; font-weight: 700; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; margin-right: 6px; vertical-align: 3px; }
.legend i.dash { border-top-style: dashed; }
.strip-note { font-size: 13px; color: var(--muted); margin-top: -10px; padding-inline: 4px; }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const root = document.documentElement;
const TODAY = "2025-02-01";
// LAST stands in for the last day in co.uk's fixtures file; the page goes no further forward.
const FIRST = DATA.dates[0], LAST = "2025-02-04";
const COMPS = DATA.comps.map(([code, name, country, tier], i) => ({ i, code, name, country, tier }));
const MATCHES = DATA.res.map((r, k) => ({ k, c: r[0], d: DATA.dates[r[1]], h: DATA.teams[r[2]], a: DATA.teams[r[3]], hg: r[4], ag: r[5], det: DATA.det[k] || null }));
const state = { day: TODAY, comps: new Set(COMPS.filter(c => c.tier === 1).map(c => c.i)), open: new Set(), month: TODAY.slice(0, 7), chart: {} };

// ---------- Helpers ----------
const toDate = s => new Date(s + "T12:00:00Z");
const iso = dt => dt.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const fmt = (s, o) => toDate(s).toLocaleDateString("en-GB", { timeZone: "UTC", ...o });
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const pts = (gf, ga) => (gf > ga ? 3 : gf === ga ? 1 : 0);
const ordinal = n => (n == null ? "–" : n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th"));
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const byDay = new Map();
for (const m of MATCHES) { if (!byDay.has(m.d)) byDay.set(m.d, []); byDay.get(m.d).push(m); }
const isUpcoming = m => m.d > TODAY;
const countOn = d => (byDay.get(d) || []).filter(m => state.comps.has(m.c)).length;

// League positions per competition after each match date: overall, home-only and away-only tables.
const SNAP = COMPS.map(comp => {
  const list = MATCHES.filter(m => m.c === comp.i);
  const teams = [...new Set(list.flatMap(m => [m.h, m.a]))];
  const tally = { overall: {}, home: {}, away: {} };
  for (const v in tally) for (const t of teams) tally[v][t] = { p: 0, gd: 0, gf: 0 };
  const add = (v, t, gf, ga) => { const x = tally[v][t]; x.p += pts(gf, ga); x.gd += gf - ga; x.gf += gf; };
  const rank = v => {
    const order = [...teams].sort((a, b) => (tally[v][b].p - tally[v][a].p) || (tally[v][b].gd - tally[v][a].gd) || (tally[v][b].gf - tally[v][a].gf) || a.localeCompare(b));
    return Object.fromEntries(order.map((t, i) => [t, i + 1]));
  };
  const snaps = [];
  for (const d of [...new Set(list.map(m => m.d))].sort()) {
    for (const m of list.filter(x => x.d === d)) {
      add("overall", m.h, m.hg, m.ag); add("overall", m.a, m.ag, m.hg);
      add("home", m.h, m.hg, m.ag); add("away", m.a, m.ag, m.hg);
    }
    snaps.push({
      d, overall: rank("overall"), home: rank("home"), away: rank("away"),
      pts: Object.fromEntries(teams.map(t => [t, tally.overall[t].p])),
      gd: Object.fromEntries(teams.map(t => [t, tally.overall[t].gd])),
    });
  }
  return { teams, snaps };
});
function snapAt(c, d, before) {
  let s = null;
  for (const x of SNAP[c].snaps) { if (before ? x.d < d : x.d <= d) s = x; else break; }
  return s;
}
function teamList(c, team, cutoff) {
  return MATCHES.filter(m => m.c === c && m.d <= cutoff && (m.h === team || m.a === team)).map(m => {
    const home = m.h === team, gf = home ? m.hg : m.ag, ga = home ? m.ag : m.hg;
    return { d: m.d, home, opp: home ? m.a : m.h, gf, ga, res: gf > ga ? "W" : gf === ga ? "D" : "L" };
  });
}
function resultText(e) {
  return `${e.res === "W" ? "Won" : e.res === "D" ? "Drew" : "Lost"} ${e.gf}–${e.ga} v ${e.opp} (${e.home ? "H" : "A"})`;
}
// Form chips; hovering one shows the result, e.g. "Won 2–1 v Arsenal (H) · Sat 25 Jan".
function chipsHtml(list) {
  return `<span class="form">${list.map(e => {
    const t = esc(`${resultText(e)} · ${fmt(e.d, { weekday: "short", day: "numeric", month: "short" })}`);
    return `<span class="f ${e.res}" title="${t}" aria-label="${t}" tabindex="0">${e.res}</span>`;
  }).join("")}</span>`;
}

// ---------- Day strip ----------
function renderDays() {
  let start = addDays(state.day, -3);
  if (start < FIRST) start = FIRST;
  let end = addDays(start, 6);
  if (end > LAST) { end = LAST; start = addDays(end, -6); }
  let html = "";
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const cls = ["day", d === TODAY ? "today" : "", countOn(d) ? "" : "empty"].join(" ");
    const dn = d === TODAY ? "Today" : fmt(d, { weekday: "short" });
    html += `<button type="button" class="${cls}" data-day="${d}" aria-pressed="${d === state.day}" aria-label="${fmt(d, { weekday: "long", day: "numeric", month: "long" })}">
      <span class="dn">${dn}</span><span class="dd num">${fmt(d, { day: "numeric" })}</span><span class="dc">${fmt(d, { month: "short" })}</span></button>`;
  }
  const box = document.getElementById("days");
  box.innerHTML = html;
  box.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => selectDay(b.dataset.day)));
  document.getElementById("day-prev").disabled = state.day <= FIRST;
  const next = document.getElementById("day-next");
  next.disabled = state.day >= LAST;
  next.title = next.disabled ? "No fixtures published beyond this day yet" : "";
  document.getElementById("strip-note").textContent =
    `Fixtures are published a few days ahead, so the calendar runs to ${fmt(LAST, { weekday: "short", day: "numeric", month: "short" })}, the last day with fixtures.`;
}

// ---------- Month picker ----------
function renderMonth() {
  const [y, mo] = state.month.split("-").map(Number);
  document.getElementById("m-title").textContent = new Date(Date.UTC(y, mo - 1, 1)).toLocaleDateString("en-GB", { timeZone: "UTC", month: "long", year: "numeric" });
  const first = new Date(Date.UTC(y, mo - 1, 1));
  const lead = (first.getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  let html = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(w => `<span class="wd">${w}</span>`).join("");
  html += "<span></span>".repeat(lead);
  for (let n = 1; n <= days; n++) {
    const d = `${state.month}-${String(n).padStart(2, "0")}`;
    const out = d < FIRST || d > LAST;
    html += `<button type="button" data-mday="${d}" class="${countOn(d) ? "has" : ""}" aria-pressed="${d === state.day}" ${out ? "disabled" : ""}>${n}</button>`;
  }
  const grid = document.getElementById("m-grid");
  grid.innerHTML = html;
  grid.querySelectorAll("[data-mday]").forEach(b => b.addEventListener("click", () => { selectDay(b.dataset.mday); toggleMonth(false); }));
  document.getElementById("m-prev").disabled = state.month <= FIRST.slice(0, 7);
  document.getElementById("m-next").disabled = state.month >= LAST.slice(0, 7);
}
function toggleMonth(open) {
  const box = document.getElementById("month"), btn = document.getElementById("month-btn");
  box.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
  if (open) { state.month = state.day.slice(0, 7); renderMonth(); }
}
function shiftMonth(n) {
  const [y, mo] = state.month.split("-").map(Number);
  const d = new Date(Date.UTC(y, mo - 1 + n, 1));
  state.month = iso(d).slice(0, 7);
  renderMonth();
}

// ---------- Competition filter ----------
function renderFilter() {
  const countries = [...new Set(COMPS.map(c => c.country))];
  let html = `<div style="display:flex;gap:6px;flex-wrap:wrap">
    <button type="button" class="btn-text" data-sel="top">Top divisions</button>
    <button type="button" class="btn-text" data-sel="all">All</button>
    <button type="button" class="btn-text" data-sel="none">None</button></div>`;
  for (const ct of countries) {
    const ids = COMPS.filter(x => x.country === ct).map(x => x.i);
    const on = ids.filter(i => state.comps.has(i)).length;
    html += `<div class="country"><label class="check country-check"><input type="checkbox" id="cty-${ct.replace(/\W/g, "")}" data-country="${ct}" ${on === ids.length ? "checked" : ""} ${on && on < ids.length ? 'data-mixed="1"' : ""}>${ct}</label>`;
    for (const c of COMPS.filter(x => x.country === ct)) {
      const n = (byDay.get(state.day) || []).filter(m => m.c === c.i).length;
      html += `<label class="check"><input type="checkbox" id="cmp-${c.code}" data-comp="${c.i}" ${state.comps.has(c.i) ? "checked" : ""}>${c.name}<span class="n num">${n || ""}</span></label>`;
    }
    html += "</div>";
  }
  const body = document.getElementById("filter-body");
  body.innerHTML = html;
  body.querySelectorAll("[data-comp]").forEach(cb => cb.addEventListener("change", () => {
    const i = +cb.dataset.comp;
    if (cb.checked) state.comps.add(i); else state.comps.delete(i);
    renderAll();
  }));
  // Country checkbox: ticks or clears every competition in that country; part-selected shows as indeterminate.
  body.querySelectorAll("[data-country]").forEach(cb => {
    cb.indeterminate = cb.dataset.mixed === "1";
    cb.addEventListener("change", () => {
      for (const c of COMPS.filter(x => x.country === cb.dataset.country)) {
        if (cb.checked) state.comps.add(c.i); else state.comps.delete(c.i);
      }
      renderAll();
    });
  });
  body.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => {
    const s = b.dataset.sel;
    state.comps = new Set(COMPS.filter(c => s === "all" || (s === "top" && c.tier === 1)).map(c => c.i));
    renderAll();
  }));
  document.getElementById("filter-toggle").textContent = `${state.comps.size} selected`;
}

// ---------- Matches ----------
function oddsTable(m, upcoming) {
  const odds = m.det[5] || {};
  const pre = odds.pre_match || {}, clo = odds.closing || {};
  const sets = { "1X2": ["home", "draw", "away"], OU: ["over", "under"], AH: ["home", "away"] };
  const implied = (o, mk, sel) => {
    const g = o[mk];
    if (!g || !g[sel]) return "";
    const sum = sets[mk].reduce((s, x) => s + (g[x] ? 1 / g[x] : 0), 0);
    return ` <small>${Math.round(100 * (1 / g[sel]) / sum)}%</small>`;
  };
  const line = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
  const cell = (o, mk, sel) => {
    if (!o[mk] || !o[mk][sel]) return "–";
    const price = o[mk][sel].toFixed(2);
    return mk === "AH" ? `${line(o.AH["line_" + sel])} @ ${price}` : price + implied(o, mk, sel);
  };
  const res = m.hg > m.ag ? "home" : m.hg === m.ag ? "draw" : "away";
  const ou = m.hg + m.ag > 2.5 ? "over" : "under";

  // Upcoming match: three equal columns, home markets left, draw centre, away markets right.
  if (upcoming) {
    const grid = [
      ["Home win", "1X2", "home"], ["Draw", "1X2", "draw"], ["Away win", "1X2", "away"],
      ["Home handicap", "AH", "home"], null, ["Away handicap", "AH", "away"],
      ["Over 2.5", "OU", "over"], null, ["Under 2.5", "OU", "under"],
    ];
    const item = c => (c ? `<div class="oitem"><span class="ol">${c[0]}</span><span class="ov">${cell(pre, c[1], c[2])}</span></div>` : "<div></div>");
    return `<div class="odds-block"><h3>Odds · market average, pre-match</h3><div class="odds3">${grid.map(item).join("")}</div></div>`;
  }

  // Result: a table of pre-match and closing prices, with the outcomes that happened highlighted.
  const rows = [["Home win", "1X2", "home"], ["Draw", "1X2", "draw"], ["Away win", "1X2", "away"], ["Over 2.5", "OU", "over"], ["Under 2.5", "OU", "under"], ["Home handicap", "AH", "home"], ["Away handicap", "AH", "away"]];
  let html = `<table class="odds"><thead><tr><th>Market</th><th>Pre-match</th><th>Closing</th></tr></thead><tbody>`;
  for (const [label, mk, sel] of rows) {
    const hit = (mk === "1X2" && sel === res) || (mk === "OU" && sel === ou);
    html += `<tr><td>${label}</td><td class="${hit ? "hit" : ""}">${cell(pre, mk, sel)}</td><td class="${hit ? "hit" : ""}">${cell(clo, mk, sel)}</td></tr>`;
  }
  return html + "</tbody></table>";
}

function pastDetail(m) {
  if (!m.det) return `<p class="note">Mockup: match details are loaded for 24 Jan – 9 Feb 2025 only.</p>`;
  const [ko, hth, hta, ref, s] = m.det;
  const before = snapAt(m.c, m.d, true), after = snapAt(m.c, m.d, false);
  const move = t => `${ordinal(before ? before.overall[t] : null)} → ${ordinal(after.overall[t])}`;
  let stats = "";
  if (s[0] == null) stats = `<p class="note">No match stats for this league.</p>`;
  else {
    const rows = [["Shots", 0], ["On target", 2], ["Corners", 4], ["Fouls", 6], ["Yellow cards", 8], ["Red cards", 10]];
    stats = rows.map(([nm, i]) => {
      const a = s[i] || 0, b = s[i + 1] || 0, tot = a + b || 1;
      return `<div class="stat"><span class="v">${a}</span><span class="bar l"><i style="width:${(a / tot) * 100}%"></i></span><span class="nm">${nm}</span><span class="bar r"><i style="width:${(b / tot) * 100}%"></i></span><span class="v">${b}</span></div>`;
    }).join("");
  }
  return `<div class="detail-grid">
    <div class="box"><h3>Match</h3>
      <div class="kv"><span>Half-time</span><b class="num">${hth}–${hta}</b></div>
      <div class="kv"><span>Kick-off</span><b class="num">${ko ? ko.slice(0, 5) : "–"}</b></div>
      <div class="kv"><span>Referee</span><b>${ref ? esc(ref) : "Not recorded"}</b></div>
      <div class="kv"><span>${esc(m.h)} position</span><b class="num">${move(m.h)}</b></div>
      <div class="kv"><span>${esc(m.a)} position</span><b class="num">${move(m.a)}</b></div>
    </div>
    <div class="box"><h3>Stats</h3>${stats}</div>
    <div class="box"><h3>Odds · market average</h3>${oddsTable(m, false)}</div>
  </div>`;
}

function side(m, team, cls) {
  const list = teamList(m.c, team, TODAY);
  const s = snapAt(m.c, TODAY, false);
  const gd = s ? s.gd[team] : 0;
  const pts6 = l => l.reduce((a, e) => a + pts(e.gf, e.ga), 0);
  const last6 = list.slice(-6), h4 = list.filter(e => e.home).slice(-4), a4 = list.filter(e => !e.home).slice(-4);
  return `<div class="side ${cls}"><div class="label">${cls === "home" ? "Home" : "Away"}</div><h3>${esc(team)}</h3>
    <div class="mini-tiles">
      <div><b class="num">${ordinal(s ? s.overall[team] : null)}</b><span>Position</span></div>
      <div><b class="num">${s ? s.pts[team] : 0}</b><span>Points</span></div>
      <div><b class="num">${gd > 0 ? "+" + gd : gd}</b><span>Goal diff</span></div>
    </div>
    <div class="form-rows">
      <span class="label">Last 6</span><span>${chipsHtml(last6)} <span class="note num">${pts6(last6)} pts</span></span>
      <span class="label">Home 4</span><span>${chipsHtml(h4)} <span class="note num">${pts6(h4)} pts</span></span>
      <span class="label">Away 4</span><span>${chipsHtml(a4)} <span class="note num">${pts6(a4)} pts</span></span>
    </div></div>`;
}

function upcomingDetail(m) {
  const view = state.chart[m.k] || "position";
  const pills = [["position", "League position"], ["venue", "Home / away"], ["form", "Form"], ["goals", "Goals"]]
    .map(([v, l]) => `<button type="button" data-cv="${v}" data-k="${m.k}" aria-pressed="${v === view}">${l}</button>`).join("");
  return `<div class="vs">${side(m, m.h, "home")}<div class="vs-mid">vs</div>${side(m, m.a, "away")}</div>
    ${m.det ? oddsTable(m, true) : ""}
    <div class="chart-box">
      <div class="chart-head"><h3 style="font-size:15px">Season so far</h3><div class="pills" role="group" aria-label="Chart">${pills}</div></div>
      <div class="legend" id="lg-${m.k}"></div>
      <div class="chart-wrap"><svg id="ch-${m.k}" viewBox="0 0 760 260" role="img" aria-label="${esc(m.h)} and ${esc(m.a)} compared"></svg></div>
      <p class="note" id="nt-${m.k}"></p>
    </div>`;
}

function renderMatches() {
  const list = (byDay.get(state.day) || []).filter(m => state.comps.has(m.c));
  const box = document.getElementById("matches");
  if (!list.length) {
    box.innerHTML = `<div class="panel empty-state">No matches on ${fmt(state.day, { weekday: "long", day: "numeric", month: "long" })} in the selected competitions.</div>`;
    return;
  }
  let html = "";
  for (const comp of COMPS) {
    const ms = list.filter(m => m.c === comp.i).sort((a, b) => ((a.det && a.det[0]) || "").localeCompare((b.det && b.det[0]) || "") || a.h.localeCompare(b.h));
    if (!ms.length) continue;
    html += `<div class="comp"><div class="comp-head"><h2>${comp.name}</h2><span class="label">${comp.country}</span></div>`;
    for (const m of ms) {
      const up = isUpcoming(m), open = state.open.has(m.k);
      const ko = m.det && m.det[0] ? m.det[0].slice(0, 5) : "";
      const hc = up ? "" : m.hg > m.ag ? "won" : m.hg < m.ag ? "lost" : "";
      const ac = up ? "" : m.ag > m.hg ? "won" : m.ag < m.hg ? "lost" : "";
      const score = up ? `<span class="score upcoming num">${ko || "TBC"}</span>` : `<span class="score num">${m.hg} – ${m.ag}</span>`;
      html += `<div class="match"><button type="button" class="row" data-k="${m.k}" aria-expanded="${open}" aria-controls="dt-${m.k}">
        <span class="ko num">${up ? "" : "FT"}</span><span class="home ${hc}">${esc(m.h)}</span>${score}<span class="away ${ac}">${esc(m.a)}</span><span class="chev" aria-hidden="true">›</span></button>
        <div class="detail" id="dt-${m.k}" ${open ? "" : "hidden"}>${open ? (up ? upcomingDetail(m) : pastDetail(m)) : ""}</div></div>`;
    }
    html += "</div>";
  }
  box.innerHTML = html;
  box.querySelectorAll(".row").forEach(b => b.addEventListener("click", () => {
    const k = +b.dataset.k;
    if (state.open.has(k)) state.open.delete(k); else state.open.add(k);
    renderMatches();
  }));
  box.querySelectorAll("[data-cv]").forEach(b => b.addEventListener("click", () => {
    state.chart[+b.dataset.k] = b.dataset.cv;
    renderMatches();
  }));
  for (const k of state.open) { const m = MATCHES[k]; if (isUpcoming(m) && m.d === state.day) drawOverlay(m); }
}

// ---------- Overlay chart for an upcoming match ----------
function drawOverlay(m) {
  const svg = document.getElementById("ch-" + m.k);
  if (!svg) return;
  const view = state.chart[m.k] || "position";
  const W = 760, H = 260, P = { l: 44, r: 16, t: 16, b: 34 };
  const nTeams = SNAP[m.c].teams.length, slots = nTeams * 2 - 2;
  const x = n => P.l + (n - 0.5) * (W - P.l - P.r) / slots;
  const ns = "http://www.w3.org/2000/svg", font = "Manrope, sans-serif";
  svg.innerHTML = "";
  const add = (tag, attrs, text) => { const el = document.createElementNS(ns, tag); for (const a in attrs) el.setAttribute(a, attrs[a]); if (text != null) el.textContent = text; svg.appendChild(el); return el; };
  const label = (xx, yy, t, anchor = "middle") => add("text", { x: xx, y: yy, "text-anchor": anchor, "font-size": 11, "font-weight": 600, fill: css("--muted"), "font-family": font }, t);
  const grid = (yy, t) => { add("line", { x1: P.l, x2: W - P.r, y1: yy, y2: yy, stroke: css("--grid") }); label(P.l - 6, yy + 4, t, "end"); };
  const hit = (xx, yy, text) => { const c = add("circle", { cx: xx, cy: yy, r: 10, fill: "transparent" }); const t = document.createElementNS(ns, "title"); t.textContent = text; c.appendChild(t); };
  const draw = (pts, colour, dash) => {
    if (!pts.length) return;
    add("polyline", { points: pts.map(p => `${p[0]},${p[1]}`).join(" "), fill: "none", stroke: colour, "stroke-width": 3, "stroke-dasharray": dash || "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
    pts.forEach((p, i) => add("circle", { cx: p[0], cy: p[1], r: i === pts.length - 1 ? 5.5 : 3, fill: i === pts.length - 1 ? colour : css("--surface"), stroke: colour, "stroke-width": 2 }));
    pts.forEach(p => hit(p[0], p[1], p[2]));
  };
  for (let n = 1; n <= slots; n++) if (n === 1 || n % 5 === 0) label(x(n), H - 12, n);
  label(W - P.r, H - 1, "Match", "end");
  const teams = [[m.h, css("--accent"), true], [m.a, css("--series-2"), false]];
  const legend = [], note = { position: "Position after each match, 1st at the top.", venue: "The home side's position in the home-only table, against the away side's position in the away-only table.", form: "Points per game over each team's last 6 matches.", goals: "Goals scored (solid) and conceded (dashed) per game, over each team's last 6 matches." }[view];
  if (view === "position" || view === "venue") {
    const y = p => P.t + (p - 1) * (H - P.t - P.b) / (nTeams - 1);
    for (const p of [1, 5, 10, 15, nTeams]) if (p <= nTeams) grid(y(p), p);
    for (const [team, colour, isHome] of teams) {
      const list = teamList(m.c, team, TODAY);
      const table = view === "position" ? "overall" : isHome ? "home" : "away";
      const pts = [];
      list.forEach((e, k) => {
        if (view === "venue" && !list.slice(0, k + 1).some(z => z.home === isHome)) return;
        const pos = snapAt(m.c, e.d, false)[table][team];
        pts.push([x(k + 1), y(pos), `${team}: ${view === "venue" ? (isHome ? "home table " : "away table ") : ""}${ordinal(pos)} · after ${resultText(e)}`]);
      });
      draw(pts, colour);
      legend.push([colour, view === "venue" ? `${team} in the ${isHome ? "home" : "away"} table` : team]);
    }
  } else if (view === "form") {
    const y = v => P.t + (3 - v) / 3 * (H - P.t - P.b);
    for (const v of [0, 1, 2, 3]) grid(y(v), v.toFixed(1));
    for (const [team, colour] of teams) {
      const list = teamList(m.c, team, TODAY);
      const pts = list.map((e, k) => { const w = list.slice(Math.max(0, k - 5), k + 1); const v = w.reduce((s, z) => s + pts_(z), 0) / w.length; return [x(k + 1), y(v), `${team}: ${v.toFixed(2)} pts/game · after ${resultText(e)}`]; });
      draw(pts, colour);
      legend.push([colour, team]);
    }
  } else {
    const series = [];
    for (const [team, colour] of teams) {
      const list = teamList(m.c, team, TODAY);
      const roll = key => list.map((e, k) => { const w = list.slice(Math.max(0, k - 5), k + 1); return [k + 1, w.reduce((s, z) => s + z[key], 0) / w.length, e]; });
      series.push([team, colour, roll("gf"), roll("ga")]);
    }
    const top = Math.max(3, Math.ceil(Math.max(...series.flatMap(s => [...s[2], ...s[3]].map(p => p[1])))));
    const y = v => P.t + (top - v) / top * (H - P.t - P.b);
    for (let v = 0; v <= top; v++) grid(y(v), v);
    for (const [team, colour, gf, ga] of series) {
      draw(gf.map(p => [x(p[0]), y(p[1]), `${team}: scoring ${p[1].toFixed(1)} per game · after ${resultText(p[2])}`]), colour);
      draw(ga.map(p => [x(p[0]), y(p[1]), `${team}: conceding ${p[1].toFixed(1)} per game · after ${resultText(p[2])}`]), colour, "6 5");
      legend.push([colour, `${team} scored`], [colour, `${team} conceded`, true]);
    }
  }
  document.getElementById("lg-" + m.k).innerHTML = legend.map(([c, t, dash]) => `<span><i class="${dash ? "dash" : ""}" style="border-color:${c}"></i>${esc(t)}</span>`).join("");
  document.getElementById("nt-" + m.k).textContent = note + " Hover a point for the result.";
}
const pts_ = e => pts(e.gf, e.ga);

// ---------- Wiring ----------
function selectDay(d) {
  if (d < FIRST || d > LAST) return;
  if (d !== state.day) state.open.clear();
  state.day = d;
  renderAll();
}
function renderAll() { renderDays(); renderFilter(); renderMatches(); if (!document.getElementById("month").hidden) renderMonth(); }

(function () {
  document.getElementById("day-prev").addEventListener("click", () => selectDay(addDays(state.day, -1)));
  document.getElementById("day-next").addEventListener("click", () => selectDay(addDays(state.day, 1)));
  document.getElementById("month-btn").addEventListener("click", () => toggleMonth(document.getElementById("month").hidden));
  document.getElementById("m-prev").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("m-next").addEventListener("click", () => shiftMonth(1));
  document.getElementById("m-today").addEventListener("click", () => { selectDay(TODAY); toggleMonth(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") toggleMonth(false); });
  const ft = document.getElementById("filter-toggle"), filter = document.getElementById("filter");
  ft.addEventListener("click", () => { const open = filter.dataset.open !== "true"; filter.dataset.open = String(open); ft.setAttribute("aria-expanded", String(open)); });

  const darkBtn = document.getElementById("theme-dark"), lightBtn = document.getElementById("theme-light");
  const current = () => root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const sync = () => { const t = current(); darkBtn.setAttribute("aria-pressed", String(t === "dark")); lightBtn.setAttribute("aria-pressed", String(t === "light")); renderMatches(); };
  darkBtn.addEventListener("click", () => { root.setAttribute("data-theme", "dark"); sync(); });
  lightBtn.addEventListener("click", () => { root.setAttribute("data-theme", "light"); sync(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sync);

  renderAll();
  sync();
})();
</script>
